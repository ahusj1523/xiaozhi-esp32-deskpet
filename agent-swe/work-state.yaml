schema_version: "0.2"
status: active

goal:
  summary: "将 LCDWiki ES3C28P 正式 UI 严格对齐已批准的 V1.1 原型，不破坏原有实机调试成果和真实音频/媒体功能"

phase:
  type: implementation
  summary: "已修已知的首页排版、会话圆角与动效、播放器封面和黄历详情差异，待烧录和实机验收"

scope:
  include:
    - "320x240 首页、语音、播放器、万年历、设置 V1.1 页面、状态与交互"
    - "HTML 计算样式与 SVG/动画契约，LVGL 运行时几何取证"
    - "保留真实天气、黄历、Jellyfin、旧服务端媒体能力协商"
    - "首页听故事和听儿歌通过服务端播放对应的 Jellyfin 歌单（原 scope 为 Go 服务端；2026-11-14 经用户确认已移植到 Python 服务端分支 codex/es3c28p-python-media-control）"
  exclude:
    - "修改 main、其他板卡或原 feat/es3c28p-touch-ui 调试分支"
    - "重做 Go 服务端、Jellyfin 音频数据链"

constraints:
  required:
    - "仅在 feat/es3c28p-interactive-ui-v1.1 分支工作；大字版改动已由 chore/push-workspace-changes 合入"
    - "prototypes/esp32-ui/index.html 为唯一批准设计基线，不得自动改动"
    - "不使用模拟服务端状态、假 ASR 文本和固定播放内容"
    - "失败门禁保留失败；无硬件或渲染证据不宣布 1:1"
    - "优先复用原 LVGL、Board、Settings、Application 与服务能力；不等待 CI"
  forbidden:
    - "修改原调试分支或未经用户授权合并、发布"
    - "删除已有队列、Seek、停止和旧服务端兼容能力以适配新原型"
  frozen:
    - "prototypes/esp32-ui/index.html"
    - "Go 服务端为媒体状态唯一事实源"

acceptance:
  - "320x240、13 状态、12 SVG、19 交互动作可重复从批准 HTML 提取"
  - "五页和对应交互以 LVGL 正式运行态提供实际证据，关键布局误差不超过 2px"
  - "图标、字体、动画、空态/错误态完成原型适配并留存明确差异"
  - "ESP-IDF 编译、串口诊断、设备触摸、音频及内存回归通过"
  - "旧调试分支保持不变，主分支不受影响"

progress:
  current:
    - "原始 V1.1 HTML 完整纳入 prototypes/esp32-ui/index.html"
    - "本地 Chromium 原型合同检查 PASS，当前无 LVGL 运行时通过证据"
    - "首页采用圆形共享机器人，并展示实际 Wi-Fi/电量、时间、天气和农历"
    - "语音页复用同一机器人，通过真实设备状态及用户识别文本更新 Listening/Thinking/Speaking"
    - "播放器按 V1.1 改布局，保留真实队列、Seek、长按停止、旧服务端禁用逻辑"
    - "万年历和家长设置按 V1.1 重新布局；真实日期、亮度、音量和 NVS 保留"
    - "机器人添加原型 3s 浮动、1.65s 语音环动画与 5s 眨眼；切页主动清除动画"
    - "书本图标改为从 V1.1 SVG 描绘的 LVGL 原生路径，未引入新字体或图像资源"
    - "万年历翻月保留已选日期，底部农历按已有黄历服务实际结果显示"
    - "已修复不存在的 Material Symbols 宏并加字体组件字形回归测试"
    - "严格门禁要求全部 13 个状态，诊断日志每次采样 begin=1，防止旧坐标污染"
    - "2026-11-12 用户四张实机照片确认：固件已运行但首页、播放器、万年历、家长设置均有重叠，设置滑杆过大"
    - "新版横屏采用 16px 正文及气泡、14px 辅助文字、18px 状态和日历标题、20px 曲名、51px 时钟"
    - "统一沿用 LVGL 原生 slider：22px 触摸容器、7px 轨道和 17px knob，消除 32px 白色滑杆"
    - "机器人复用单一对象与眨眼时钟，增加 neutral/happy/thinking/sad/speaking 五种嘴眼表情"
    - "新增碰撞检查及字体实际行高溢出警告；当前静态复核无短于 16px 的普通文本盒"
    - "会话复用真实 ASR/TTS 消息列表，首条消息后缩小机器人并启用独立滚动"
    - "本机 LVGL 验证通过：首页行高、会话列表滚动与切页、六周日历布局、设置页文字边界；严格真机门禁待验收"
    - "首页时钟冒号单独着色、温度使用 20px。语音环随状态呼吸或旋转，气泡按角色缩小一个底角。播放器封面使用径向渐变，黄历以宜忌分行展示真实条目"
    - "听故事/听儿歌链路已静态复核：hello 协商 media_playlist_start、StartMediaPlaylist 延迟开通道、MQTT 空包绑定 UDP 回程，服务端回包驱动 pending/超时/重试状态机"
    - "修复启动失败后迟到成功回包不清除失败标记导致播放键误重启；media_playlist_start_supported_ 在断连/复位/重启路径统一清零"
    - "改动行已用 clang-format 19 格式化；主机测试其余失败均为环境问题（缺编译器、临时目录锁）或分支既有问题（HTML 哈希、config.json 唤醒词），与本改动无关"
    - "构建环境结论：可用 IDF 在 WSL Ubuntu-24.04 的 ~/esp-idf-pr2179（release/v6.1）；Windows 侧 Espressif-PR2179 为空壳克隆、5.4.1 不合规；以后默认 rsync 覆盖热构建目录 ~/xiaozhi-v11-49c443f-aIEof0 增量构建"
    - "2026-11-14 三个变体（lcdwiki-es3c28p、-landscape、-landscape-diag）增量编译全部通过，应用分区余 30-31%"
    - "2026-11-14 21:05 经用户确认先备份后烧录：16MB 完整备份+分区表核对+活动槽确认后，landscape-diag 写入 0x20000 哈希校验通过；串口见 ES3C28P_RES 诊断日志证明新固件运行；功能实测仍待进行"
    - "2026-11-14 深夜排障：8010 被 digital-human 测试脚本占用致 hello 不可达是点播失败根因；经用户选择把听故事/听儿歌移植到 Python 服务端分支 codex/es3c28p-python-media-control（hello 协商+play_story/play_song+歌单入队），新增 4 测试全过、全套 102 过 8 个环境性失败经 stash 基线对照确认无关；改动未提交，待部署 .87 复测"
    - "2026-11-15 凌晨：MiMo high risk 英文错误排查完毕——上游以 200 SSE 正文概率性返回拒绝（同载荷回放26过、线上多次拒、51秒内翻转），代码无此串；按用户要求不加兜底掩盖，已部署纯观测日志（LLM_REQUEST_LOG=1+OPENAI_LOG=debug+拒绝告警），查询/复现/关闭方法记入实施记录；待办：观察下次自然复现"
